[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atl4s-v4ult"
version = "0.1.0"
description = "ATL4S::V4UlT — a private, local-first project vault and control room for two people."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["atl4s*"]

[tool.setuptools.package-data]
atl4s = [
  "templates/*.html",
  "templates/partials/*.html",
  "static/*.css",
  "static/*.js",
  "static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
